<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172b55" />
      <stop offset="100%" stop-color="#0b1730" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#background)" />
  <!-- Walking pad base -->
  <rect x="22" y="93" width="84" height="15" rx="7.5" fill="none" stroke="url(#accent)" stroke-width="5.5" />
  <line x1="36" y1="100.5" x2="92" y2="100.5" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
  <!-- Walker: head -->
  <circle cx="69" cy="25" r="7.5" fill="#f8fafc" />
  <!-- Walker: torso -->
  <path d="M64 38 L58 61" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Walker: arms (both attached at shoulder 64,38) -->
  <path d="M64 39 L74 49 L85 46" fill="none" stroke="#f8fafc" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M64 39 L51 47 L44 58" fill="none" stroke="#f8fafc" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Walker: legs (both attached at hip 58,61) -->
  <path d="M58 61 L71 72 L75 85" fill="none" stroke="#f8fafc" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M58 61 L48 74 L40 85" fill="none" stroke="#f8fafc" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
